<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="orangeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EA580C;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="url(#orangeGradient)" />
  
  <!-- Letters with better spacing and typography -->
  <g fill="white" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" text-anchor="middle" dominant-baseline="central">
    <!-- F -->
    <text x="11" y="17">F</text>
    <!-- S -->
    <text x="21" y="17">S</text>
  </g>
  
  <!-- Subtle highlight -->
  <rect width="32" height="16" rx="6" fill="url(#highlight)" opacity="0.1" />
  
  <defs>
    <linearGradient id="highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
  </defs>
</svg>